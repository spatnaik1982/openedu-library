name: Generate Catalog

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: catalog-generation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Regenerate catalog.json
        env:
          REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --no-install open-edu-registry generate-catalog --repo "$REPO" --out catalog.json --strict
      - name: Open PR for regenerated catalog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B chore/catalog-regeneration origin/main
          git add catalog.json
          if git diff --cached --quiet; then
            echo "catalog.json unchanged; nothing to do"
            exit 0
          fi
          git commit -m "chore(catalog): regenerate catalog.json"
          git push -u --force origin chore/catalog-regeneration
          gh pr create \
            --base main \
            --head chore/catalog-regeneration \
            --title "chore(catalog): regenerate catalog.json" \
            --body "Regenerated automatically by the Generate Catalog workflow." || true
